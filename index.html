<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="מרכז שליטה"><title>מרכז השליטה — דוד</title><link rel="manifest" href="manifest.json"><style>body{font-family:Arial,sans-serif;background:#f5f5ef;margin:0;padding:16px;color:#222}.card{background:#fff;border-radius:18px;padding:18px;margin:12px auto;max-width:700px;box-shadow:0 2px 10px #0002}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc}textarea{min-height:80px}button{background:#173f35;color:#fff;border:0;border-radius:12px;padding:12px;margin:4px}.item{background:#eee;padding:10px;border-radius:10px;margin:6px 0}</style></head><body><div class="card"><h1>🧠 מרכז השליטה — דוד</h1><p>איפוס יומי • מיקוד • רעיונות • סגירת מעגלים</p></div><div class="card"><h2>🌅 ניקוי ראש</h2><textarea id="mind" placeholder="מה יושב לי בראש עכשיו?"></textarea><button onclick="saveMind()">שמור</button></div><div class="card"><h2>🎯 עוגן היום</h2><input id="anchor" placeholder="הדבר האחד שאני מסיים היום"><textarea id="reason" placeholder="למה זה חשוב?"></textarea><button onclick="saveAnchor()">שמור</button><div id="anchorView"></div></div><div class="card"><h2>🌳 משימות</h2><input id="task" placeholder="משימה חדשה"><button onclick="addTask()">הוסף</button><div id="tasks"></div></div><div class="card"><h2>💡 כספת רעיונות</h2><input id="idea" placeholder="שם הרעיון"><textarea id="ideaText" placeholder="תיאור"></textarea><button onclick="addIdea()">שמור רעיון</button><div id="ideas"></div></div><div class="card"><h2>🆘 מצב הצפה</h2><button onclick="focusMode()">הצג רק צעד אחד</button><div id="focus"></div></div><div class="card"><h2>🌙 סיכום יום</h2><textarea id="win" placeholder="מה סיימתי היום?"></textarea><textarea id="tomorrow" placeholder="מה הצעד הראשון למחר?"></textarea><button onclick="saveEvening()">שמור</button></div><script>const get=k=>JSON.parse(localStorage.getItem(k)||'[]');const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function saveMind(){set('mind',mind.value);alert('נשמר')}function saveAnchor(){set('anchor',{a:anchor.value,r:reason.value});render()}function addTask(){if(task.value){let a=get('tasks');a.push(task.value);set('tasks',a);task.value='';render()}}function addIdea(){if(idea.value){let a=get('ideas');a.push({n:idea.value,t:ideaText.value});set('ideas',a);idea.value='';ideaText.value='';render()}}function saveEvening(){let a=get('history');a.push({date:new Date().toLocaleString('he-IL'),win:win.value,tomorrow:tomorrow.value});set('history',a);alert('סיכום נשמר')}function focusMode(){focus.innerHTML='<div class="item">'+(get('tasks')[0]||'אין משימה. הוסף צעד קטן')+'</div>'}function removeTask(i){let a=get('tasks');a.splice(i,1);set('tasks',a);render()}function render(){tasks.innerHTML=get('tasks').map((x,i)=>`<div class="item">${x}<button onclick="removeTask(${i})">✓</button></div>`).join('');ideas.innerHTML=get('ideas').map(x=>`<div class="item"><b>${x.n}</b><br>${x.t}</div>`).join('');let a=JSON.parse(localStorage.getItem('anchor')||'null');anchorView.innerHTML=a?`<div class="item">🎯 ${a.a}<br>${a.r}</div>`:''}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
